<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İyi ki Doğdun Ferahiye 🤍</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fff,#eee);
font-family:Arial;
overflow:hidden;
}
.card{
background:white;
padding:25px;
border-radius:22px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.2);
animation:fade 2s;
}
img{
width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
}
h1{margin:15px 0 5px;}
p{color:#555;}
.heart{
position:absolute;
font-size:20px;
animation:fly 6s linear infinite;
}
@keyframes fly{
from{transform:translateY(100vh);opacity:1;}
to{transform:translateY(-10vh);opacity:0;}
}
@keyframes fade{
from{opacity:0;transform:scale(.9);}
to{opacity:1;}
}
</style>
</head>
<body>

<div class="card">
<img src="foto.jpg">
<h1>Ferahiye</h1>
<p>Hayatımın en güzel parçası 🤍</p>
</div>

<audio autoplay loop>
<source src="https://dl.sndup.net/9d5f/ferahiye.mp3" type="audio/mpeg">
</audio>

<script>
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="🤍";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},500);
</script>

</body>
</html>
